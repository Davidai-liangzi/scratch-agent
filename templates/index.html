<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch 项目生成器</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f4f5f7;
    color: #1f2329;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 860px;
    margin: 0 auto;
    background: #fff;
    box-shadow: 0 0 24px rgba(0,0,0,.06);
  }
  header {
    padding: 14px 20px;
    font-weight: 600;
    font-size: 16px;
    border-bottom: 1px solid #e5e6eb;
    background: #fff;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 82%;
    padding: 9px 13px;
    border-radius: 12px;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: #3370ff;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .log {
    align-self: flex-start;
    background: #f2f3f5;
    color: #4e5969;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-size: 12.5px;
    border-bottom-left-radius: 4px;
  }
  .system {
    align-self: center;
    color: #86909c;
    font-size: 12.5px;
    background: transparent;
    padding: 2px 8px;
  }
  .download {
    align-self: center;
  }
  .download a {
    display: inline-block;
    padding: 10px 22px;
    background: #00b42a;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
  }
  #composer {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid #e5e6eb;
    background: #fff;
  }
  #input {
    flex: 1;
    resize: none;
    border: 1px solid #d9dbe0;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  #input:focus { border-color: #3370ff; }
  #send {
    padding: 0 22px;
    border: none;
    border-radius: 8px;
    background: #3370ff;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { background: #b8c4e0; cursor: not-allowed; }
</style>
</head>
<body>
  <div id="app">
    <header>Scratch 项目生成器</header>
    <div id="messages"></div>
    <div id="composer">
      <textarea id="input" rows="2" placeholder="描述你想生成的 Scratch 游戏/功能（例如：购物中心游览，含 3 条可选路线）"></textarea>
      <button id="send">发送</button>
    </div>
  </div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

let mode = 'idle';   // idle | generating | awaiting_feedback
let es = null;

function addEl(className, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + className;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addDownload() {
  const div = document.createElement('div');
  div.className = 'msg download';
  const a = document.createElement('a');
  a.href = '/api/download';
  a.textContent = '⬇ 下载 my_ai_game.sb3';
  div.appendChild(a);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setMode(m) {
  mode = m;
  if (m === 'generating') {
    sendBtn.disabled = true;
    inputEl.placeholder = '生成中，请稍候…';
  } else if (m === 'awaiting_feedback') {
    sendBtn.disabled = false;
    sendBtn.textContent = '提交反馈';
    inputEl.placeholder = '描述要修改的问题（留空点“提交反馈”= 结束本次）';
    inputEl.value = '';
  } else {
    sendBtn.disabled = false;
    sendBtn.textContent = '发送';
    inputEl.placeholder = '描述你想生成的 Scratch 游戏/功能（例如：购物中心游览，含 3 条可选路线）';
    inputEl.value = '';
  }
}

function connectStream() {
  if (es) es.close();
  es = new EventSource('/api/stream');
  es.onmessage = (e) => {
    let item;
    try { item = JSON.parse(e.data); } catch (_) { return; }
    if (item.type === 'log') {
      addEl('log', item.content);
    } else if (item.type === 'await_feedback') {
      setMode('awaiting_feedback');
      addEl('system', '✅ 生成完成。如需调整，请描述问题后提交；否则直接提交结束。');
    } else if (item.type === 'done') {
      setMode('idle');
      if (es) { es.close(); es = null; }
      if (item.has_sb3) {
        addEl('system', '🎉 已生成！点击下方按钮下载。');
        addDownload();
      } else {
        addEl('system', '❌ 本次生成未成功，请重新描述需求再试。');
      }
    }
  };
  es.onerror = () => { /* 连接中断会自动重连，这里不处理 */ };
}

async function send() {
  const text = inputEl.value.trim();
  if (mode === 'generating') return;

  if (mode === 'idle') {
    if (!text) return;
    addEl('user', text);
    inputEl.value = '';
    setMode('generating');
    await fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: text })
    });
    connectStream();
  } else if (mode === 'awaiting_feedback') {
    // 允许空提交 = 结束本次
    if (text) addEl('user', text);
    inputEl.value = '';
    setMode('generating');
    await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ feedback: text })
    });
  }
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>
</body>
</html>
