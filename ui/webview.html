<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratch Agent</title>
<link rel="stylesheet" href="highlight.css">
<script src="qwebchannel.js"></script>
<script src="marked.min.js"></script>
<script src="highlight.min.js"></script>
<style>
  :root {
    --bg: #1e1e2e;
    --text: #e6e6e6;
    --bubble-user: #0d6efd;
    --bubble-user-text: #ffffff;
    --bubble-ai: #2a2a3d;
    --bubble-ai-text: #e6e6e6;
    --code-bg: #16161f;
    --code-text: #e6e6e6;
    --step-bg: rgba(255,255,255,0.04);
    --step-detail: #9a9ab0;
    --border: #3a3a4d;
    --line-height-body: 1.6;
    --line-height-heading: 1.25;
    --line-height-code: 1.6;
  }
  :root[data-theme="light"] {
    --bg: #f5f6f8;
    --text: #1a1a1a;
    --bubble-user: #0d6efd;
    --bubble-user-text: #ffffff;
    --bubble-ai: #ffffff;
    --bubble-ai-text: #1a1a1a;
    --code-bg: #f0f0f0;
    --code-text: #1a1a1a;
    --step-bg: rgba(0,0,0,0.05);
    --step-detail: #888;
    --border: #ddd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    line-height: var(--line-height-body);
  }
  #messages { max-width: 900px; margin: 0 auto; padding: 28px 20px 40px; }
  .msg { display: flex; margin-bottom: 18px; }
  .msg.user { flex-direction: column; align-items: flex-end; }
  .msg.ai { justify-content: flex-start; }
  .bubble {
    max-width: 80%;
    padding: 11px 15px;
    border-radius: 14px;
    line-height: 1.65;
    word-break: break-word;
    font-size: 14px;
  }
  .msg.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .msg.ai .bubble {
    background: var(--bubble-ai);
    color: var(--bubble-ai-text);
    border-bottom-left-radius: 4px;
  }
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble pre {
    background: var(--code-bg);
    color: var(--code-text);
    padding: 12px 14px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .bubble code {
    font-family: "Cascadia Code", Consolas, "Courier New", monospace;
    font-size: 0.9em;
  }
  .bubble pre code { font-size: 0.88em; line-height: var(--line-height-code); }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 22px; }
  .bubble h1, .bubble h2, .bubble h3 { margin: 12px 0 6px; line-height: var(--line-height-heading); }
  .bubble blockquote { border-left: 3px solid #555; margin: 8px 0; padding-left: 10px; opacity: 0.85; }
  .bubble table { border-collapse: collapse; margin: 8px 0; }
  .bubble th, .bubble td { border: 1px solid #444; padding: 5px 9px; }

  /* 流式打字光标：打字过程中在气泡末尾闪烁 */
  .stream-bubble::after {
    content: '▍';
    margin-left: 1px;
    color: var(--bubble-ai-text);
    animation: cursor-blink 0.8s steps(1) infinite;
  }
  @keyframes cursor-blink { 50% { opacity: 0; } }

  /* 加载动画：跳舞的省略号（等待 AI 回复时在底部闪烁） */
  .typing-dots {
    display: flex;
    align-items: center;
    gap: 4px;
    width: fit-content;
    padding: 11px 15px;
    margin-bottom: 18px;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    background: var(--bubble-ai);
  }
  .typing-dots .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--bubble-ai-text);
    animation: dot-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots .dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* 步骤卡片（P1 步骤 4） */
  #steps { max-width: 900px; margin: 0 auto; padding: 0 20px 12px; }
  .step-card {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 13px;
    margin-bottom: 6px;
    border-radius: 8px;
    background: var(--step-bg);
    font-size: 13px;
    border-left: 3px solid transparent;
  }
  .step-card.status-start { border-left-color: #f0ad4e; }
  .step-card.status-done { border-left-color: #28a745; opacity: 0.75; }
  .step-card.status-fail { border-left-color: #dc3545; }
  .step-icon { font-size: 15px; }
  .step-title { font-weight: 600; }
  .step-detail { color: var(--step-detail); font-size: 12px; }
  .step-status { margin-left: auto; font-size: 13px; }
  .step-status.spin { display: inline-block; animation: step-spin 1s linear infinite; }
  @keyframes step-spin { to { transform: rotate(360deg); } }

  /* 主题切换按钮 + 代码复制按钮（P2 步骤 7） */
  #theme-toggle {
    position: fixed;
    top: 12px;
    right: 16px;
    z-index: 100;
    width: 34px;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--bubble-ai);
    color: var(--text);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  .copy-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bubble-ai);
    color: var(--text);
    cursor: pointer;
    font-size: 11px;
    opacity: 0.7;
  }
  .copy-btn:hover { opacity: 1; }

  /* 「回到底部」悬浮按钮（需求①）：用户上滑查看历史时出现 */
  #scroll-bottom-btn {
    position: fixed;
    right: 16px;
    bottom: 24px;
    z-index: 90;
    display: none;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--bubble-ai);
    color: var(--text);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  #scroll-bottom-btn:hover { border-color: #6b7280; }

  /* sb3 文件卡片（需求②）：AI 气泡内展示生成的项目，整卡可点击打开 */
  .sb3-card {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--step-bg);
    cursor: pointer;
    font-size: 13px;
    user-select: none;
  }
  .sb3-card:hover { border-color: #0d6efd; background: rgba(13,110,253,0.12); }
  .sb3-card .sb3-icon { font-size: 18px; }
  .sb3-card .sb3-name { font-weight: 600; word-break: break-all; }
  .sb3-card .sb3-open { margin-left: auto; color: var(--step-detail); font-size: 12px; }
  .sb3-card:hover .sb3-open { color: #0d6efd; }

  /* 门控未通过横幅：产物仍可打开，但明确标记「未通过质检」 */
  .gate-banner {
    margin-top: 8px;
    padding: 10px 12px;
    border: 1px solid #d9a406;
    border-left: 4px solid #f0ad4e;
    border-radius: 10px;
    background: rgba(240,173,78,0.14);
    font-size: 13px;
    line-height: 1.55;
  }
  .gate-banner .gate-title { font-weight: 700; color: #a06a00; }
  .gate-banner .gate-detail { margin-top: 4px; color: var(--text); word-break: break-word; }
  .gate-banner .gate-report {
    margin-top: 4px; color: var(--step-detail); font-size: 12px; word-break: break-all;
  }

  /* 用户消息 meta（P0 步骤③）：时间 + 复制 + 修改 */
  .msg-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    font-size: 11px;
    justify-content: flex-end;
  }
  .msg-time { color: var(--step-detail); }
  .meta-btn {
    background: transparent;
    border: none;
    color: var(--step-detail);
    cursor: pointer;
    font-size: 11px;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .meta-btn:hover { color: var(--text); background: var(--step-bg); }

  /* 上下文使用率（agent 收尾时显示在其气泡右下角）：默认浅色，悬停变亮 */
  .ctx-usage {
    margin-top: 6px;
    text-align: right;
    font-size: 11px;
    color: var(--bubble-ai-text);
    opacity: 0.55;
    transition: opacity 0.15s ease;
  }
  .ctx-usage:hover { opacity: 1; }

  /* 用户消息原位编辑（P1 修复⑤） */
  .inline-edit {
    width: 100%;
    min-height: 52px;
    background: transparent;
    color: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  .inline-actions {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    justify-content: flex-end;
  }
</style>
</head>
<body>
<button id="theme-toggle" title="切换主题">🌙</button>
<button id="scroll-bottom-btn" title="回到底部">↓</button>
<div id="messages"></div>
<script>
  // —— 滚动跟随（需求①）：生成期间不抢夺用户视角 ——
  // autoFollow=true 时新内容自动滚到底；用户上滑离开底部即自动关闭，滑回底部自动恢复。
  var autoFollow = true;
  var FOLLOW_GAP = 80;   // 距底部 80px 内视为「在底部」

  function isNearBottom() {
    return (window.innerHeight + window.scrollY) >=
           (document.documentElement.scrollHeight - FOLLOW_GAP);
  }

  function syncScrollBtn() {
    var btn = document.getElementById('scroll-bottom-btn');
    if (!btn) { return; }
    btn.style.display = (!autoFollow && !isNearBottom()) ? 'flex' : 'none';
  }

  function scrollBottom(force) {
    if (force || autoFollow) {
      window.scrollTo(0, document.documentElement.scrollHeight);
    }
  }

  window.addEventListener('scroll', function () {
    autoFollow = isNearBottom();
    syncScrollBtn();
  }, { passive: true });

  // —— 消息渲染：用户纯文本右对齐，AI markdown 左对齐 ——
  function formatTime(ts) {
    if (!ts) { return ''; }
    var d = new Date(ts * 1000);
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function makeMetaBtn(label, onClick) {
    var b = document.createElement('button');
    b.className = 'meta-btn';
    b.textContent = label;
    b.onclick = onClick;
    return b;
  }

  // 原位编辑用户气泡（P1 修复⑤）：点击「修改」把气泡内容替换为 textarea，确认后更新并回填输入框
  function startInlineEdit(bubble, text) {
    var ta = document.createElement('textarea');
    ta.className = 'inline-edit';
    ta.value = text;
    var actions = document.createElement('div');
    actions.className = 'inline-actions';
    actions.appendChild(makeMetaBtn('确认', function () {
      var newText = ta.value;
      bubble.textContent = newText;
      if (bridge && bridge.editMessage) { bridge.editMessage(newText); }
    }));
    actions.appendChild(makeMetaBtn('取消', function () {
      bubble.textContent = text;
    }));
    bubble.innerHTML = '';
    bubble.appendChild(ta);
    bubble.appendChild(actions);
    ta.focus();
  }

  function makeMsg(role, text, ts) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'user') {
      bubble.textContent = text;
    } else {
      bubble.innerHTML = marked.parse(text || '');
      bubble.querySelectorAll('pre code').forEach(function (block) {
        hljs.highlightElement(block);
      });
      addCopyButtons(bubble);
    }
    wrap.appendChild(bubble);
    if (role === 'ai') { lastAiBubble = bubble; }
    if (role === 'user') {
      var meta = document.createElement('div');
      meta.className = 'msg-meta';
      if (ts) {
        var t = document.createElement('span');
        t.className = 'msg-time';
        t.textContent = formatTime(ts);
        meta.appendChild(t);
      }
      meta.appendChild(makeMetaBtn('复制', function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        }
      }));
      meta.appendChild(makeMetaBtn('修改', function () {
        startInlineEdit(bubble, text);
      }));
      wrap.appendChild(meta);
    }
    document.getElementById('messages').appendChild(wrap);
    scrollBottom();
  }

  // Python 侧通过 runJavaScript 调用这些全局函数推消息
  window.appendUser = function (text, ts) {
    autoFollow = true;   // 用户发新消息 → 恢复自动跟随
    makeMsg('user', text, ts);
    syncScrollBtn();
  };
  window.appendAi = function (text) { makeMsg('ai', text); };

  // —— 步骤卡片（P1 步骤 4）：按 kind 聚合，start/done/fail 更新同一张卡片 ——
  var stepCards = {};
  var STEP_ICONS = { outline: '🧭', request: '🤖', assets: '🎨', pack: '⚙️', verify: '🔍', done: '🎉' };

  window.appendStep = function (kind, status, title, detail) {
    var messages = document.getElementById('messages');
    var steps = document.getElementById('steps');
    if (!steps) {
      steps = document.createElement('div');
      steps.id = 'steps';
      messages.appendChild(steps);
    }
    var card = stepCards[kind];
    if (!card) {
      var el = document.createElement('div');
      el.className = 'step-card';
      el.innerHTML = '<span class="step-icon"></span><span class="step-title"></span>' +
                     '<span class="step-detail"></span><span class="step-status"></span>';
      steps.appendChild(el);
      card = {
        el: el,
        icon: el.querySelector('.step-icon'),
        title: el.querySelector('.step-title'),
        detail: el.querySelector('.step-detail'),
        status: el.querySelector('.step-status'),
      };
      stepCards[kind] = card;
    }
    card.icon.textContent = STEP_ICONS[kind] || '•';
    card.title.textContent = title;
    card.detail.textContent = detail || '';
    card.el.className = 'step-card status-' + (status || 'start');
    if (status === 'done') {
      card.status.textContent = '✅';
      card.status.classList.remove('spin');
    } else if (status === 'fail') {
      card.status.textContent = '❌';
      card.status.classList.remove('spin');
    } else {
      card.status.textContent = '⏳';
      card.status.classList.add('spin');
    }
    // 等待 AI 生成文字时，在底部显示跳舞的省略号
    if (status === 'start' && (kind === 'outline' || kind === 'request')) {
      showTyping();
    }
    scrollBottom();
  };

  // —— 加载动画：跳舞的省略号（等待 AI 回复时在底部闪烁）——
  var typingIndicator = null;

  function showTyping() {
    if (typingIndicator) { return; }
    var el = document.createElement('div');
    el.className = 'typing-dots';
    el.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    document.getElementById('messages').appendChild(el);
    typingIndicator = el;
    scrollBottom();
  }

  function hideTyping() {
    if (typingIndicator) {
      typingIndicator.remove();
      typingIndicator = null;
    }
  }

  // —— 流式打字机（P1 步骤 5）：AI 回复逐 token 追加，结束后转 markdown 渲染 ——
  // 优化：网络 chunk 只进缓冲，由前端定时器按自适应速率逐字上屏，
  // 与网络到达速率解耦，避免"整段一起蹦出来"。
  var streamBubble = null;
  var pendingText = '';
  var streamOpen = false;
  var lastAiBubble = null;     // 最近一条 AI 文本气泡（用于挂「上下文使用率」）
  var ctxUsageText = '';       // 待渲染的上下文使用率正文
  var ctxUsageTip = '';
  var typingTimer = null;
  var TYPING_TICK = 24;        // 打字节拍（毫秒）
  var TYPING_MIN = 1;          // 每拍最少上屏字符数
  var TYPING_TARGET_MS = 800;  // 缓冲堆积时，尽量在该窗口内追平延迟

  function stopTyping() {
    if (typingTimer) {
      clearInterval(typingTimer);
      typingTimer = null;
    }
  }

  function typeStep() {
    if (!streamBubble) { stopTyping(); return; }
    if (pendingText.length > 0) {
      var n = Math.max(TYPING_MIN, Math.ceil(pendingText.length / (TYPING_TARGET_MS / TYPING_TICK)));
      streamBubble.textContent += pendingText.slice(0, n);
      pendingText = pendingText.slice(n);
      scrollBottom();
    }
    // 缓冲打完且流已结束 → 渲染 markdown
    if (pendingText.length === 0 && !streamOpen) {
      finalizeStream();
    }
  }

  function finalizeStream() {
    stopTyping();
    if (!streamBubble) { return; }
    var raw = streamBubble.textContent;
    streamBubble.innerHTML = marked.parse(raw);
    streamBubble.querySelectorAll('pre code').forEach(function (block) {
      hljs.highlightElement(block);
    });
    addCopyButtons(streamBubble);
    streamBubble.classList.remove('stream-bubble');
    streamBubble = null;
    pendingText = '';
    renderCtxUsage();   // 正文定稿后再挂「上下文使用率」，避免被 innerHTML 覆盖
    scrollBottom();
  }

  window.appendChunk = function (text) {
    hideTyping();   // 首字到达，隐藏加载省略号
    if (!streamBubble) {
      var wrap = document.createElement('div');
      wrap.className = 'msg ai';
      var bubble = document.createElement('div');
      bubble.className = 'bubble stream-bubble';
      wrap.appendChild(bubble);
      document.getElementById('messages').appendChild(wrap);
      streamBubble = bubble;
      lastAiBubble = bubble;
    }
    pendingText += text;
    streamOpen = true;
    if (!typingTimer) { typingTimer = setInterval(typeStep, TYPING_TICK); }
  };

  window.endStream = function () {
    streamOpen = false;
    hideTyping();
    // 没有正在打字（例如整段早已打完）→ 直接收尾；否则等 typeStep 打完再收尾
    if (!typingTimer && streamBubble) {
      finalizeStream();
    }
  };

  // —— 上下文使用率（agent 收尾时挂到其气泡右下角）：text 为空则移除 ——
  // 注意：打字动画未结束时先不挂（正文还在 textContent += ，且 finalizeStream 会重写
  // innerHTML），等 finalizeStream 收尾后再渲染，避免污染正文或被覆盖。
  function renderCtxUsage() {
    if (!lastAiBubble) { return; }
    if (typingTimer) { return; }
    var el = lastAiBubble.querySelector('.ctx-usage');
    if (!ctxUsageText) {
      if (el) { el.remove(); }
      return;
    }
    if (!el) {
      el = document.createElement('div');
      el.className = 'ctx-usage';
      lastAiBubble.appendChild(el);
    }
    el.textContent = ctxUsageText;
    el.title = ctxUsageTip || ctxUsageText;
  }

  window.setContextUsage = function (text, tip) {
    ctxUsageText = text || '';
    ctxUsageTip = tip || '';
    renderCtxUsage();
    scrollBottom();
  };

  // —— sb3 文件卡片（需求②）：生成的 .sb3 以卡片形式出现在 AI 气泡中，整卡可点击打开 ——
  window.appendSb3Card = function (name, path) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ai';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    var card = document.createElement('div');
    card.className = 'sb3-card';
    card.title = '点击打开：' + path;
    card.innerHTML = '<span class="sb3-icon">📦</span>' +
                     '<span class="sb3-name"></span>' +
                     '<span class="sb3-open">点击打开</span>';
    card.querySelector('.sb3-name').textContent = name;
    card.onclick = function () {
      if (bridge && bridge.openSb3) { bridge.openSb3(path); }
    };
    bubble.appendChild(card);
    wrap.appendChild(bubble);
    document.getElementById('messages').appendChild(wrap);
    scrollBottom();
  };

  // —— 门控未通过横幅：产物仍可打开，但明确标记「未通过质检」——
  window.appendGateBanner = function (title, detail, reportPath) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ai';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    var box = document.createElement('div');
    box.className = 'gate-banner';
    var t = document.createElement('div');
    t.className = 'gate-title';
    t.textContent = '⚠️ ' + (title || '未通过自动质检（产物已保留）');
    box.appendChild(t);
    if (detail) {
      var d = document.createElement('div');
      d.className = 'gate-detail';
      d.textContent = detail;
      box.appendChild(d);
    }
    if (reportPath) {
      var r = document.createElement('div');
      r.className = 'gate-report';
      r.textContent = '质检报告：' + reportPath;
      box.appendChild(r);
    }
    bubble.appendChild(box);
    wrap.appendChild(bubble);
    document.getElementById('messages').appendChild(wrap);
    scrollBottom();
  };

  // —— 清空对话区 + 步骤卡片 + 流式状态（P2 步骤 6 会话切换用）——
  window.clearMessages = function () {
    document.getElementById('messages').innerHTML = '';
    stepCards = {};
    hideTyping();
    stopTyping();
    pendingText = '';
    streamOpen = false;
    streamBubble = null;
    lastAiBubble = null;
    ctxUsageText = '';
    ctxUsageTip = '';
    autoFollow = true;   // 切换会话后恢复自动跟随
    syncScrollBtn();
  };

  // —— 代码复制按钮（P2 步骤 7）：给 pre 代码块加「复制」按钮 ——
  function addCopyButtons(container) {
    container.querySelectorAll('pre').forEach(function (pre) {
      if (pre.querySelector('.copy-btn')) { return; }
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = '复制';
      btn.onclick = function () {
        var code = pre.querySelector('code')
          ? pre.querySelector('code').textContent
          : pre.textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(function () {
            btn.textContent = '已复制';
            setTimeout(function () { btn.textContent = '复制'; }, 1500);
          });
        }
      };
      pre.style.position = 'relative';
      pre.appendChild(btn);
    });
  }

  // —— 主题切换（P2 步骤 7）：深色 ↔ 浅色 ——
  function toggleTheme() {
    var root = document.documentElement;
    var next = (root.getAttribute('data-theme') === 'light') ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    document.getElementById('theme-toggle').textContent = next === 'dark' ? '🌙' : '☀️';
  }
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

  // —— 「回到底部」按钮（需求①）：点击平滑回底并恢复自动跟随 ——
  document.getElementById('scroll-bottom-btn').addEventListener('click', function () {
    autoFollow = true;
    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
    syncScrollBtn();
  });

  // —— QWebChannel 双向通信：JS 调 Python ——
  var bridge = null;
  if (typeof qt !== 'undefined' && qt.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, function (channel) {
      bridge = channel.objects.bridge;
      if (bridge && bridge.onReady) {
        bridge.onReady();   // 通知 Python：前端已加载、桥已就绪
      }
    });
  }
</script>
</body>
</html>
